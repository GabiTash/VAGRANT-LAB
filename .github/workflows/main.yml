name: Vagrant Lab CI-CD

on:
  push:
    branches:
      - master
  workflow_dispatch:    
    paths:
      - 'Vagrantfile'

jobs:
  vagrant-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Vagrant Lab
        working-directory: ${{ github.workspace }}
        run: |
          # הרצת הפקודה
          vagrant up --provision