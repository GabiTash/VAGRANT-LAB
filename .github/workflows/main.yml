name: Vagrant Lab CI-CD

on:
  push:
    branches:
      - master
    paths:
      - 'Vagrantfile'
  workflow_dispatch: # השורה הזו שומרת על הכפתור הידני פעיל

jobs:
  vagrant-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Vagrant Lab
        # הגדרה זו פותרת את השגיאה מהתמונה image_edd17c.png
        working-directory: VAGRANT-LAB 
        run: |
          echo "Listing files to verify Vagrantfile location:"
          dir
          vagrant up --provision